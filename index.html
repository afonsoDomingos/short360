<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorts360 - Criador de Shorts Automático</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Shorts360</h1>
            <p class="subtitle">Crie shorts automaticamente</p>
        </header>

        <main>
            <div class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon" id="uploadIcon">📹</div>
                    <div class="spinner" id="uploadSpinner"></div>
                    <p id="uploadText">Arraste seu vídeo</p>
                    <p class="upload-hint">ou clique para selecionar</p>
                    <p class="loading-text" id="loadingText">Carregando vídeo...</p>
                    <input type="file" id="videoInput" accept="video/*" hidden>
                </div>
                <div class="video-info" id="videoInfo" style="display: none;">
                    <p id="videoName"></p>
                    <p id="videoDuration"></p>
                    <button class="new-video-btn" id="newVideoBtn">🔄 Novo Vídeo</button>
                </div>
                <div class="video-preview" id="videoPreview" style="display: none;">
                    <video id="previewVideo" controls muted></video>
                </div>
            </div>

            <div class="settings-section">
                <div class="setting-group">
                    <label for="splitMode">Modo de divisão:</label>
                    <select id="splitMode">
                        <option value="duration" selected>Por duração</option>
                        <option value="count">Por número de shorts</option>
                    </select>
                </div>

                <div class="setting-group" id="durationGroup">
                    <label for="shortDuration">Duração:</label>
                    <select id="shortDuration">
                        <option value="15">15s</option>
                        <option value="30" selected>30s</option>
                        <option value="45">45s</option>
                        <option value="60">60s</option>
                    </select>
                </div>

                <div class="setting-group" id="countGroup" style="display: none;">
                    <label for="shortCount">Número de shorts:</label>
                    <select id="shortCount">
                        <option value="2">2 shorts</option>
                        <option value="3" selected>3 shorts</option>
                        <option value="4">4 shorts</option>
                        <option value="5">5 shorts</option>
                        <option value="6">6 shorts</option>
                        <option value="8">8 shorts</option>
                        <option value="10">10 shorts</option>
                    </select>
                    <p class="calculated-duration" id="calculatedDuration"></p>
                </div>

                <div class="setting-group">
                    <label for="quality">Qualidade:</label>
                    <select id="quality">
                        <option value="low">Baixa (rápido)</option>
                        <option value="medium" selected>Média</option>
                        <option value="high">Alta (lento)</option>
                    </select>
                </div>

                <button id="generateBtn" class="btn-primary" disabled>
                    <span class="btn-text">Gerar Shorts</span>
                    <span class="btn-spinner"></span>
                </button>
            </div>

            <div class="progress-section" id="progressSection" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p id="progressText">Processando...</p>
            </div>

            <div class="results-section" id="resultsSection" style="display: none;">
                <h2>Shorts Gerados</h2>
                <div class="shorts-list" id="shortsList"></div>
                <button id="downloadAllBtn" class="btn-secondary">
                    Baixar Todos
                </button>
            </div>
        </main>

        <footer>
            <p>Shorts360</p>
        </footer>
    </div>

    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
