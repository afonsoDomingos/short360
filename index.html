<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorts360 - Criador de Shorts Automático</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Shorts360</h1>
            <p class="subtitle">Crie shorts automaticamente</p>
        </header>

        <main>
            <div class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📹</div>
                    <p>Arraste seu vídeo</p>
                    <p class="upload-hint">ou clique para selecionar</p>
                    <input type="file" id="videoInput" accept="video/*" hidden>
                </div>
                <div class="video-info" id="videoInfo" style="display: none;">
                    <p id="videoName"></p>
                    <p id="videoDuration"></p>
                </div>
            </div>

            <div class="settings-section">
                <div class="setting-group">
                    <label for="shortDuration">Duração:</label>
                    <select id="shortDuration">
                        <option value="15">15s</option>
                        <option value="30" selected>30s</option>
                        <option value="45">45s</option>
                        <option value="60">60s</option>
                    </select>
                </div>

                <button id="generateBtn" class="btn-primary" disabled>
                    Gerar Shorts
                </button>
            </div>

            <div class="progress-section" id="progressSection" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p id="progressText">Processando...</p>
            </div>

            <div class="results-section" id="resultsSection" style="display: none;">
                <h2>Shorts Gerados</h2>
                <div class="shorts-list" id="shortsList"></div>
                <button id="downloadAllBtn" class="btn-secondary">
                    Baixar Todos
                </button>
            </div>
        </main>

        <footer>
            <p>Shorts360</p>
        </footer>
    </div>

    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
